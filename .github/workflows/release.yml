name: Release & Build CI

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Test Executable
        run: node dist/cli.js help

      - name: Package Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf fan-${{ github.ref_name }}.tar.gz dist package.json package-lock.json install.sh README.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fan-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
